<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Семейное древо Дуловых</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3ede1; --paper:#fbf7ef; --card:#fffdf8; --ink:#2a241d; --muted:#7d7263; --line:#bcae98; --line2:#ddd2bf;
  --shadow:0 1px 2px rgba(70,45,10,.08),0 6px 18px rgba(70,45,10,.08);
  --dul:#2f6690; --kor:#4b7d4f; --sta:#a24f2a; --kuz:#b07d12; --pet:#7a4d8c; --inlaw:#8e8578; --me:#231d16;
  --focus:#c2410c; --hyp:#9a8f80;
  --bark:#8a6844; --leaf:#6f9a52; --ground:#e3d6bd; --canopy:#9cbf7a;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Manrope,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#15120e; --paper:#1c1813; --card:#252019; --ink:#efe6d6; --muted:#a99d8a; --line:#5d5245; --line2:#3a332a;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.35);
    --dul:#6fa6d6; --kor:#82b886; --sta:#e08a5f; --kuz:#e2b44c; --pet:#b98bd0; --inlaw:#a39a8c; --me:#f3e8d4;
    --focus:#fb923c; --hyp:#8a8070;
    --bark:#a8865f; --leaf:#7fae5d; --ground:#27211a; --canopy:#4f7a3a;
  }
}
:root[data-theme="dark"]{color-scheme:dark;
    --bg:#15120e; --paper:#1c1813; --card:#252019; --ink:#efe6d6; --muted:#a99d8a; --line:#5d5245; --line2:#3a332a;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.35);
    --dul:#6fa6d6; --kor:#82b886; --sta:#e08a5f; --kuz:#e2b44c; --pet:#b98bd0; --inlaw:#a39a8c; --me:#f3e8d4;
    --focus:#fb923c; --hyp:#8a8070;
    --bark:#a8865f; --leaf:#7fae5d; --ground:#27211a; --canopy:#4f7a3a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
header{position:relative;z-index:20;background:var(--paper);border-bottom:1px solid var(--line2);padding-block:10px 9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:9px}
.top{display:flex;align-items:center;gap:8px}
.top .ttl{flex:1;min-width:0}
.top h1{font-family:var(--serif);font-weight:700;font-size:25px;line-height:1;margin:0}
.top .lg{margin-top:4px;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px 1px 6px;vertical-align:middle}
.ibtn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
@media (min-width:900px){
  header{flex-direction:row;align-items:center;padding-block:12px}
  .top{flex:1}
  .tabs{width:540px}
  .top h1{font-size:28px}
}
.searchbar{position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--line2);padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:none;box-shadow:var(--shadow)}
.searchbar.on{display:block}
.searchbar input{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink);outline:none}
.sugg div{padding:10px 6px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:14px}
.sugg div:last-child{border-bottom:0}
.sugg small{color:var(--muted)}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.stage{overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.drag{cursor:grabbing}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.canvas svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
/* линии в «Семье» */
.edge{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.edge.cpl{stroke-width:2.2}
/* карточки */
.card{position:absolute;background:var(--card);border-radius:13px;box-shadow:var(--shadow);border:1px solid var(--line2);padding:9px 11px 8px 15px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--inlaw))}
.card .rel{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--c,var(--muted));font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}
.card .n1{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.08;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .n1 i{font-style:normal;font-weight:600;color:var(--muted);font-size:14.5px}
.card .n2{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.sm .n1{font-size:16px}.card.sm .n2{font-size:11.5px}.card.sm .rel{font-size:9.5px}
.card.hyp{border-style:dashed;border-color:var(--hyp);background:color-mix(in srgb,var(--card) 55%,transparent);box-shadow:none}
.card.ph{border:1.5px dashed var(--line);background:color-mix(in srgb,var(--card) 35%,transparent);box-shadow:none;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12px;padding:8px}
.card.ph::before{display:none}
.card.anc{border:2px solid color-mix(in srgb,var(--bark) 70%,transparent)}
.card.focus{border:2px solid var(--focus);box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 20%,transparent),var(--shadow)}
.card.me{background:var(--me);color:var(--paper);border-color:var(--me)}
.card.me .dt,.card.me .n1 i{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.card.me .rel{color:#f2bf5e}
.card .av{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 28%;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line2);pointer-events:none}
.card.me .av{box-shadow:0 0 0 2px var(--me),0 0 0 3px #f2bf5e}
.card.hasav .rel,.card.hasav .n1{padding-right:44px}
.card.hasav .badge{right:54px}
.badge{position:absolute;right:9px;top:7px;font-size:10px;font-weight:800;color:var(--muted)}
.sib{position:absolute;right:8px;bottom:7px;font-size:10.5px;font-weight:800;color:var(--muted);background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:0 7px;line-height:17px}
.card.me .sib{background:transparent;color:var(--paper)}
.gl{position:absolute;font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.05;color:var(--muted);text-align:right;opacity:.85}
.gl small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;opacity:.8}
@media (hover:hover){.card[data-id]{cursor:pointer;transition:transform .15s ease}.card[data-id]:hover{transform:translateY(-2px)}}
/* кнопки масштаба и подсказка */
.zoom{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:15}
.zoom button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--card);box-shadow:var(--shadow);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.zoom svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;z-index:16;white-space:nowrap;transition:opacity .5s;pointer-events:none;max-width:calc(100% - 90px);overflow:hidden;text-overflow:ellipsis}
.toast.off{opacity:0}
/* список */
.list{max-width:860px;margin:0 auto;padding-block:10px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.list h2{font-family:var(--serif);font-size:23px;margin:20px 4px 6px;display:flex;align-items:center;gap:10px}
.list h2 .sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.row{display:flex;gap:10px;align-items:center;padding:11px 10px;border-radius:12px;cursor:pointer;border-bottom:1px solid var(--line2)}
.row:active,.row:hover{background:var(--paper)}
.row .nm{font-weight:700;flex:1;min-width:0}
.row .nm i{font-style:normal;color:var(--muted);font-weight:500}
.row .nm small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.row .yr{color:var(--muted);font-size:12.5px;flex:0 0 auto;text-align:right}
/* о древе */
.about{max-width:760px;margin:0 auto;padding-block:16px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.about h2{font-family:var(--serif);font-size:26px;margin:18px 0 6px}
.about .muted{color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0}
.legend div{background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:9px 11px;font-size:13px}

/* телефон: семья обычной прокруткой */
.nav{max-width:560px;margin:0 auto;padding-block:4px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.navbar{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;background:var(--bg)}
.nbtn{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--ink)}
.nbtn.ghost{background:transparent}
.g1{display:grid;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gpair+.gpair{margin-top:10px}
.glab{font-size:12px;color:var(--muted);font-weight:700;margin:0 2px 6px}
.sec2{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:800;margin:18px 2px 8px}
.conn{width:2px;height:18px;background:var(--bark);opacity:.55;margin:10px auto -6px;border-radius:2px}
.ncard{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-width:0;background:var(--card);border:1px solid var(--line2);border-left:5px solid var(--c);border-radius:14px;padding:10px;box-shadow:var(--shadow);cursor:pointer;font:inherit;color:var(--ink)}
.ncard:active{transform:scale(.98)}
.ncard.me{background:var(--me);color:var(--paper);border-color:var(--me)}
.ncard.hyp{border-style:dashed;box-shadow:none;background:transparent}
.ncard.ph{justify-content:center;text-align:center;color:var(--muted);border:1.5px dashed var(--line);box-shadow:none;background:transparent;min-height:58px;font-size:13px;cursor:default}
.nav-av{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:15px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card))}
.nav-av img{width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.ncard.mini{padding:8px}
.ncard.mini .nav-av{width:34px;height:34px;font-size:12px}
.nt{display:flex;flex-direction:column;min-width:0}
.nr{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard.me .nr{color:#f2bf5e}
.nn{font-weight:700;font-size:14.5px;line-height:1.22;overflow-wrap:anywhere}
.ncard.mini .nn{font-size:13px}
.nd{font-size:12px;color:var(--muted)}
.ncard.me .nd{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.hero{background:var(--paper);border:1px solid var(--line2);border-top:6px solid var(--c);border-radius:18px;padding:18px 16px 16px;margin-top:14px;text-align:center;box-shadow:var(--shadow)}
.hph{display:block;width:124px;height:156px;border-radius:14px;object-fit:cover;object-position:50% 25%;margin:0 auto 12px;box-shadow:var(--shadow)}
.hph.ini{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;font-family:var(--serif);font-size:40px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));box-shadow:none}
.hrel{font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:800;color:var(--c)}
.hero h2{font-family:var(--serif);font-size:30px;line-height:1.05;margin:4px 0 2px;text-wrap:balance}
.hms{color:var(--muted);font-size:13px}
.hkv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;text-align:left;margin:14px auto 4px;max-width:420px;font-size:14px}
.hkv dt{color:var(--muted)}.hkv dd{margin:0}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.hs .ncard{flex:0 0 76%;scroll-snap-align:start}
.ncard-notes{background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:10px 12px 10px 30px}

/* телефон: всё древо сверху вниз */
.out{max-width:620px;margin:0 auto;padding-block:4px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.otop{position:sticky;top:0;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:10px 0;background:var(--bg);-webkit-overflow-scrolling:touch}
.otop .nbtn{flex:0 0 auto}
.nbtn.sm{padding:8px 12px;font-size:13px}
.ohelp{color:var(--muted);font-size:13px;margin:2px 2px 6px}
.oside{margin:22px 2px 0;font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:var(--muted)}
.osec{font-family:var(--serif);font-size:26px;margin:6px 2px 4px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.osec .sw{width:12px;height:12px;border-radius:50%;background:var(--c)}
.on{position:relative}
.orow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-left:4px solid var(--c);border-radius:12px;padding:8px 10px;margin-top:8px;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.orow .nav-av{width:38px;height:38px;font-size:13px}
.orow .nn{font-size:14.5px}
.orow .nn i{font-style:normal;color:var(--muted);font-weight:500}
.orow.main{border:2px solid var(--bark);border-left:6px solid var(--bark);background:color-mix(in srgb,var(--bark) 9%,var(--card))}
.orow.me{background:var(--me);color:var(--paper);border-color:var(--me)}
.orow.me .nd,.orow.me .nn i{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.orow.hyp{border-style:dashed;box-shadow:none;background:transparent}
.orow.flash{animation:oflash 1.4s ease}
@keyframes oflash{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 45%,transparent)}100%{box-shadow:var(--shadow)}}
.osp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:5px 0 0 22px}
.ochip{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px dashed var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.ochip small{color:var(--muted)}
.ochip.main{border:1.5px solid var(--bark);font-weight:700}
.olink{font:inherit;font-size:12.5px;font-weight:700;color:var(--dul);background:none;border:0;padding:4px 2px;cursor:pointer}
.okids{margin-left:13px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--c) 45%,var(--line2))}
.onote{font-size:12px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:reduce){.orow.flash{animation:none}}
/* карточка человека */
.panel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--paper);border-left:1px solid var(--line2);box-shadow:-10px 0 30px rgba(0,0,0,.14);transform:translateX(105%);transition:transform .25s ease;z-index:40;display:flex;flex-direction:column}
.panel.on{transform:none}
.panel .hd{padding:18px 20px 12px;border-bottom:1px solid var(--line2);position:relative}
.panel .hd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--inlaw))}
.panel .grip{display:none}
.panel .x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:20px;cursor:pointer;line-height:1}
.panel .hd.hasph{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.panel .pph{width:92px;height:116px;border-radius:12px;object-fit:cover;object-position:50% 25%;box-shadow:var(--shadow);cursor:zoom-in;grid-row:span 4}
.panel .pph.big{width:100%;height:auto;max-height:60vh;object-fit:contain;grid-column:1/-1;cursor:zoom-out}
.panel .rel{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:800;color:var(--c,var(--muted))}
.panel h3{font-family:var(--serif);font-size:29px;line-height:1.04;margin:4px 44px 2px 0}
.panel .mn{color:var(--muted);font-size:13px}
.panel .bd{padding:14px 20px 34px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:14px;margin:0 0 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:800;margin:16px 0 7px}
.notes{margin:0;padding-left:18px;font-size:14px}
.notes li{margin:5px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--c,var(--inlaw))}
.src a{color:var(--dul);word-break:break-word}
.st{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;margin:8px 6px 0 0;border:1px solid var(--line2);color:var(--muted)}
.st.hyp{border-style:dashed}
.st.doc{color:var(--kor);border-color:var(--kor)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:35;display:none}
.scrim.on{display:block}
@media (max-width:700px){
  .top .lg{display:none}
  .top h1{font-size:23px}
  .tabs button{font-size:12.3px;padding:8px 2px}

 {id:'zak', sn:'Пидько', fn:'Захар', pn:'Павлович', b:'1909', d:'17.08.1944', dead:true, pl:'Уроженец Челябинской обл., Курганского р-на (сейчас Курганская обл.); погиб в Мурманской обл.', oc:'Ефрейтор, наводчик ПТР (противотанкового ружья)', rel:'Прапрадед', br:'pet', st:'doc',
   notes:['Записан в «Памяти народа»: именной список безвозвратных потерь за 1944 г. (нашла мама). Фамилия по мужской линии — Пидько, через «Д».',
          'Призван в 1942 г. в Приморском крае. В графе «ближайшие родственники» — жена, Пидько Феодосия (Осиповна).',
          'Убит в августе 1944 г.: в списке у соседних строк 17.08.1944, у Захара почерк читается как 7 или 17 августа.',
          'Похоронен: северный берег р. (оз.?) Толванд, 21 км южнее дороги от ст. Нямозеро, Кандалакшский р-н Мурманской обл., могила № 4. Это Карельский фронт, Кандалакшское направление. Позже его перенесли в братскую могилу: в «Памяти народа» есть это воинское захоронение с памятником, и имя Захара на нём увековечено (нашла мама).',
          'Родом с Урала: Челябинская обл., Курганский р-н, село — читается плохо (мама прочитала «Клокуль…»). Раскулачены и приехали в Приморье. Мама: по её маминой линии были зажиточные крестьяне, свой двор.',
          'В Приморье фамилию путали: Пидько, Питько, Петько.',
          'Зацепка: на Урале раскулачены Пидько с тем же отчеством — Ефим Павлович (с. Булдак, Курганский округ) и Федор Павлович (1907). Возможно, это братья Захара. Тогда Пидько Иван Ефимович из Владивостока — его племянник. Не подтверждено.'],
   src:[['Пидько Е. П., с. Булдак (база раскулаченных Челябинского архива)','https://dbases.archive74.ru/disposs/disposs/view?id=31344'],['Пидько Ф. П., 1907 («Открытый список»)','https://ru.openlist.wiki/Пидько_Федор_Павлович_(1907)'],['Пидько Иван Ефимович («Бессмертный полк», Владивосток)','https://www.moypolk.ru/soldier/pidko-ivan-efimovich']]},
 {id:'feo', sn:'Пидько', ms:'Питько', fn:'Феодосия', pn:'Иосифовна', dead:true, rel:'Прапрабабушка', br:'pet', f:'ios',
   notes:['Девичья фамилия — Питько. Вышла за Захара Пидько и стала Пидько (мама). Забавное совпадение: Питько вышла за Пидько.',
          'Раскулачена вместе с мужем, приехали с Урала.',
          'После гибели Захара на войне, видимо, вышла за Моисея Акимова — отсюда дети Акимовы (гипотеза).',
          'Отчество в народной форме — Осиповна.']},

const byId=Object.fromEntries(P.map(p=>[p.id,p]));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mobile=()=>innerWidth<700;
let hideDates=false;
const yearOf=s=>{const m=String(s||'').match(/(\d{4})/);return m?+m[1]:null};
const spouses=id=>U.filter(u=>u.includes(id)).map(u=>u[0]===id?u[1]:u[0]);
const children=id=>P.filter(p=>p.f===id||p.m===id).map(p=>p.id);
const byBirth=(a,b)=>(yearOf(byId[a].b)||9999)-(yearOf(byId[b].b)||9999);
function siblings(id){const p=byId[id];return P.filter(q=>q.id!==id&&((p.f&&q.f===p.f)||(p.m&&q.m===p.m))).map(q=>q.id)}
const color=p=>BR[p.br]?BR[p.br].c:'var(--inlaw)';

class Stage{
  constructor(el){
    this.el=el;this.c=el.querySelector('.canvas');this.s=1;this.x=0;this.y=0;this.W=1;this.H=1;this.p=new Map();this.onTap=null;this.moved=0;
    el.addEventListener('pointerdown',e=>this.down(e));
    el.addEventListener('pointermove',e=>this.move(e));
    el.addEventListener('pointerup',e=>this.up(e,false));
    el.addEventListener('pointercancel',e=>this.up(e,true));
    el.addEventListener('wheel',e=>{e.preventDefault();const r=el.getBoundingClientRect();this.zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.012:0.0018)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  }
  set(html,W,H){this.c.innerHTML=html;this.W=W;this.H=H;this.c.style.width=W+'px';this.c.style.height=H+'px'}
  get vw(){return this.el.clientWidth||innerWidth}
  get vh(){return this.el.clientHeight||innerHeight}
  apply(){
    const m=50,cw=this.W*this.s,ch=this.H*this.s;
    const ax=this.vw-cw-m,ay=this.vh-ch-m;
    this.x=clamp(this.x,Math.min(ax,m),Math.max(ax,m));
    this.y=clamp(this.y,Math.min(ay,m),Math.max(ay,m));
    this.c.style.transform=`translate3d(${this.x}px,${this.y}px,0) scale(${this.s})`;
  }
  zoomAt(f,px,py){const ns=clamp(this.s*f,.12,2.4);this.x=px-(px-this.x)*ns/this.s;this.y=py-(py-this.y)*ns/this.s;this.s=ns;this.apply()}
  zoomBy(f){this.zoomAt(f,this.vw/2,this.vh/2)}
  fit(){const pad=20;this.s=clamp(Math.min((this.vw-pad*2)/this.W,(this.vh-pad*2)/this.H),.12,1.1);this.x=(this.vw-this.W*this.s)/2;this.y=(this.vh-this.H*this.s)/2;this.apply()}
  center(cx,cy,s){if(s)this.s=s;this.x=this.vw/2-cx*this.s;this.y=this.vh/2-cy*this.s;this.apply()}
  down(e){
    if(e.button>0)return;
    try{this.el.setPointerCapture(e.pointerId)}catch(_){}
    this.p.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(this.p.size===1){this.t0=Date.now();this.sx=e.clientX;this.sy=e.clientY;this.moved=0}
    else{this.moved=99;const [a,b]=[...this.p.values()];this.pd=Math.hypot(a.x-b.x,a.y-b.y)||1;this.pm={x:(a.x+b.x)/2,y:(a.y+b.y)/2}}

  }
  move(e){
    if(!this.p.has(e.pointerId))return;
    const prev=this.p.get(e.pointerId),cur={x:e.clientX,y:e.clientY};this.p.set(e.pointerId,cur);
    if(this.p.size===1){this.x+=cur.x-prev.x;this.y+=cur.y-prev.y;this.moved=Math.max(this.moved,Math.hypot(cur.x-this.sx,cur.y-this.sy));this.apply()}
    else{const [a,b]=[...this.p.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};const r=this.el.getBoundingClientRect();
      this.x+=m.x-this.pm.x;this.y+=m.y-this.pm.y;this.zoomAt(d/this.pd,m.x-r.left,m.y-r.top);this.pd=d;this.pm=m}
  }
  up(e,cancel){
    if(!this.p.has(e.pointerId))return;
    this.p.delete(e.pointerId);
    if(this.p.size===0){
      this.el.classList.remove('drag');
      if(!cancel&&this.moved<9&&Date.now()-this.t0<800){
        const t=document.elementFromPoint(e.clientX,e.clientY);const c=t&&t.closest('.card[data-id]');
        if(c&&this.onTap)this.onTap(c.dataset.id);
      }
    }else{const [v]=[...this.p.values()];this.sx=v.x;this.sy=v.y}
  }
}

/* ===================== ВИД «ВСЁ ДРЕВО» (все люди одним деревом) ===================== */
const allPos={};let allDrawn=false;
function gensFromMe(){const g={[ME]:0};const q=[ME];while(q.length){const id=q.shift(),p=byId[id];const nb=[];
  if(p.f)nb.push([p.f,-1]);if(p.m)nb.push([p.m,-1]);children(id).forEach(c=>nb.push([c,1]));spouses(id).forEach(s=>nb.push([s,0]));
  nb.forEach(([n,d])=>{if(g[n]===undefined&&byId[n]){g[n]=g[id]+d;q.push(n)}})}return g}
function pedigreeSet(){const s=new Set();const walk=id=>{if(!id||s.has(id))return;s.add(id);walk(byId[id].f);walk(byId[id].m)};walk(ME);return s}
function pava(y,w){const v=[],wt=[],len=[];for(let i=0;i<y.length;i++){v.push(y[i]);wt.push(w[i]);len.push(1);
  while(v.length>1&&v[v.length-2]>v[v.length-1]){const a=v.length-2,nw=wt[a]+wt[a+1];v[a]=(v[a]*wt[a]+v[a+1]*wt[a+1])/nw;wt[a]=nw;len[a]+=len[a+1];v.pop();wt.pop();len.pop()}}
  const out=[];v.forEach((val,i)=>{for(let k=0;k<len[i];k++)out.push(val)});return out}

      if(hub){const sp=spouses(hub);chain=[sp[0],hub,...sp.slice(1)]}

    const k=par.join('+');if(!unions.has(k))unions.set(k,{par,kids:[]});unions.get(k).kids.push(id)});
  const UL=[...unions.values()];
  Object.values(layers).flat().forEach(b=>{b.unions=UL.filter(u=>u.par.every(m=>blockOf[m]===b))});
  const cx=m=>{const b=blockOf[m];return b.x+b.off[b.m.indexOf(m)]};
  const ux=u=>u.par.reduce((s,m)=>s+cx(m),0)/u.par.length;
  const down=b=>{const t=[];b.m.forEach((m,i)=>{const p=byId[m];const par=[p.f,p.m].filter(x=>x&&blockOf[x]);if(par.length)t.push(ux(unions.get(par.join('+')))-b.off[i])});return t.length?t.reduce((a,c)=>a+c,0)/t.length:null};
  const up=b=>{const t=[];b.unions.forEach(u=>{const km=u.kids.reduce((s,k)=>s+cx(k),0)/u.kids.length;const uo=u.par.reduce((s,m)=>s+b.off[b.m.indexOf(m)],0)/u.par.length;t.push(km-uo)});return t.length?t.reduce((a,c)=>a+c,0)/t.length:null};

  }

    <linearGradient id="gg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ground)"/><stop offset="1" stop-color="var(--ground)" stop-opacity=".15"/></linearGradient></defs>`;
  svg+=`<ellipse cx="${W/2}" cy="${rowTop(gmin)+(rowTop(gmax)-rowTop(gmin))*.45}" rx="${W*.6}" ry="${(rowTop(gmax)-rowTop(gmin))*.75+160}" fill="url(#cg2)"/>`;

const SECT=[
  {root:'leo',br:'dul',name:'Дуловы',side:'Папина сторона'},
  {root:'mik',br:'kor',name:'Коротченко',side:'Папина сторона'},
  {root:'vst',br:'sta',name:'Стахеевы',side:'Мамина сторона'},
  {root:'vku',br:'kuz',name:'Кузьменко',side:'Мамина сторона'},
  {root:'ios',br:'pet',name:'Питько · Пидько',side:'Мамина сторона'}];
let outDrawn=false;
const hasPar=id=>{const p=byId[id];return !!(p&&(p.f||p.m))};
function sectOf(id){const seen=new Set(),q=[id];while(q.length){const x=q.shift();if(!x||seen.has(x))continue;seen.add(x);
  const s=SECT.find(s=>s.root===x);if(s)return s;const p=byId[x];if(p){q.push(p.f);q.push(p.m)}}return null}
const kidsOfPair=(a,b)=>P.filter(p=>(p.f===a&&p.m===b)||(p.f===b&&p.m===a)).map(p=>p.id).sort(byBirth);
const kidsSingle=id=>P.filter(p=>(p.f===id&&!p.m)||(p.m===id&&!p.f)).map(p=>p.id).sort(byBirth);
function orow(id,main){const p=byId[id],ph=PH[id];
  return `<button class="orow${main?' main':''}${id===ME?' me':''}${p.st==='hyp'?' hyp':''}" data-go="${id}" style="--c:${color(p)}">`+
    `<span class="nav-av">${ph?`<img src="${ph}" alt="">`:esc(initials(p))}</span>`+
    `<span class="nt"><span class="nn">${esc(fullName(p)||p.fn)}${p.ms&&p.ms!=='?'?` <i>(${esc(p.ms)})</i>`:''}</span><span class="nd">${esc(shortRel(p.rel))}${shortDates(p)?' · '+esc(shortDates(p)):''}</span></span></button>`}
function onode(id,anc){
  const p=byId[id];let h=`<div class="on" id="o-${id}" style="--c:${color(p)}">`+orow(id,anc.has(id));
  let kids='';
  U.filter(u=>u.includes(id)).forEach(u=>{
    const s=u[0]===id?u[1]:u[0],sp=byId[s];
    const own=hasPar(u[0])?u[0]:(hasPar(u[1])?u[1]:u[0]);
    const ks=[...kidsOfPair(u[0],u[1]),...(hasPar(s)?[]:kidsSingle(s))];
    let link='';
    if(own!==id&&hasPar(s)){const sc=sectOf(s);link=`<button class="olink" data-jump="${s}">семья — в ветви ${esc(sc?sc.name:'')} ↓</button>`}
    else if(hasPar(s)){const sc=sectOf(s);link=`<button class="olink" data-jump="${s}">${/а$/.test(sp.fn)||/на$/.test(sp.pn||'')?'её':'его'} родня — ветвь ${esc(sc?sc.name:'')} ↓</button>`}
    h+=`<div class="osp"><button class="ochip${anc.has(s)?' main':''}" data-go="${s}" style="--c:${color(sp)}">⚭ ${esc([sp.fn,realSn(sp)].filter(Boolean).join(' '))} <small>${esc(shortRel(sp.rel))}</small></button>${link}</div>`;
    if(own===id&&ks.length)kids+=`<div class="okids">${ks.map(k=>onode(k,anc)).join('')}</div>`;
  });
  const single=kidsSingle(id);
  if(single.length)kids+=`<div class="okids"><div class="onote">второй родитель неизвестен</div>${single.map(k=>onode(k,anc)).join('')}</div>`;
  return h+kids+'</div>';
}

/* ===================== ВИД «СЕМЬЯ» ===================== */
let focusId=ME;
function renderFam(){
  const CW=196,CH=88,GX=22,GC=16,RG=64,PAD=40;
  const out=[],edges=[],pos={};
  const rowY=r=>(r+2)*(CH+RG);
  function addCard(id,x,r,o){pos[id]={x,y:rowY(r)};out.push({id,x,y:rowY(r),o:o||{}})}
  function addPh(t,x,r){out.push({ph:t,x,y:rowY(r)})}
  function unit(id,depth){
    const sp=spouses(id);const groups=[];
    if(depth>0){const map=new Map();
      children(id).forEach(k=>{const c=byId[k];const other=c.f===id?c.m:c.f;const key=other||'_';if(!map.has(key))map.set(key,[]);map.get(key).push(k)});
      [...sp,...[...map.keys()].filter(k=>!sp.includes(k))].forEach(k=>{if(map.has(k))groups.push({other:k==='_'?null:k,kids:map.get(k).sort(byBirth).map(c=>unit(c,depth-1))})});
    }
    const left=sp.length>=2?[sp[0]]:[],right=sp.length>=2?sp.slice(1):sp;
    const ownW=CW+sp.length*(CW+GC);const all=groups.flatMap(g=>g.kids);
    const kidsW=all.reduce((s,u)=>s+u.w,0)+Math.max(0,all.length-1)*GX;
    return {id,left,right,groups,ownW,kidsW,w:Math.max(ownW,kidsW)};
  }
  function placeUnit(u,x0,r,isFocus){
    const ox=x0+(u.w-u.ownW)/2;let cx=ox;
    u.left.forEach(s=>{addCard(s,cx,r);cx+=CW+GC});
    addCard(u.id,cx,r,{focus:isFocus});const selfX=cx;cx+=CW+GC;
    u.right.forEach(s=>{addCard(s,cx,r);cx+=CW+GC});
    [...u.left,...u.right].forEach(s=>{const a=Math.min(pos[s].x,selfX),b=Math.max(pos[s].x,selfX);edges.push({t:'cpl',x1:a+CW,x2:b,y:rowY(r)+CH/2})});
    let kx=x0+(u.w-u.kidsW)/2;
    u.groups.forEach(g=>{
      let ox2,oy;
      if(g.other&&pos[g.other]&&pos[g.other].y===rowY(r)){const a=Math.min(pos[g.other].x,selfX),b=Math.max(pos[g.other].x,selfX);ox2=(a+CW+b)/2;oy=rowY(r)+CH/2}
      else{ox2=selfX+CW/2;oy=rowY(r)+CH}
      g.kids.forEach(k=>{placeUnit(k,kx,r+1,false);const cxk=kx+(k.w-k.ownW)/2+(k.left.length?(CW+GC):0)+CW/2;edges.push({t:'pc',x1:ox2,y1:oy,x2:cxk,y2:rowY(r+1)});kx+=k.w+GX});
    });
  }
  const F=byId[focusId];
  const rowIds=[...siblings(focusId),focusId].sort(byBirth);
  let fu=unit(focusId,2);if(fu.w>1500)fu=unit(focusId,1);
  let x=0;const rc={};
  rowIds.forEach(id=>{if(id===focusId){placeUnit(fu,x,0,true);rc[id]=pos[id].x+CW/2;x+=fu.w+GX}else{addCard(id,x,0);rc[id]=x+CW/2;x+=CW+GX}});
  const fa=F.f,mo=F.m;
  if(fa||mo){
    const xs=Object.values(rc);const fc=rc[focusId];
    const mid=clamp((Math.min(...xs)+Math.max(...xs))/2,fc-CW*1.2,fc+CW*1.2);
    const fx=mid-GC/2-CW,mx=mid+GC/2;
    if(fa)addCard(fa,fx,-1);else addPh('Отец неизвестен',fx,-1);
    if(mo)addCard(mo,mx,-1);else addPh('Мать неизвестна',mx,-1);
    if(fa&&mo)edges.push({t:'cpl',x1:fx+CW,x2:mx,y:rowY(-1)+CH/2});
    rowIds.forEach(id=>{const c=byId[id];let ox,oy;
      if(fa&&mo&&c.f===fa&&c.m===mo){ox=(fx+CW+mx)/2;oy=rowY(-1)+CH/2}
      else if(fa&&c.f===fa){ox=fx+CW/2;oy=rowY(-1)+CH}
      else if(mo&&c.m===mo){ox=mx+CW/2;oy=rowY(-1)+CH}else return;
      edges.push({t:'pc',x1:ox,y1:oy,x2:rc[id],y2:rowY(0)})});
    const cw2=2*CW+GC,gp=[];
    if(fa){const p=byId[fa];if(p.f||p.m)gp.push({kid:fx,cx:fx+CW/2,f:p.f,m:p.m})}
    if(mo){const p=byId[mo];if(p.f||p.m)gp.push({kid:mx,cx:mx+CW/2,f:p.f,m:p.m})}
    if(gp.length===2){const need=cw2+GX,d=gp[1].cx-gp[0].cx;if(d<need){const sh=(need-d)/2;gp[0].cx-=sh;gp[1].cx+=sh}}
    gp.forEach(g=>{const gx=g.cx-cw2/2,gm=gx+CW+GC;
      if(g.f)addCard(g.f,gx,-2);else addPh('Отец неизвестен',gx,-2);
      if(g.m)addCard(g.m,gm,-2);else addPh('Мать неизвестна',gm,-2);
      if(g.f&&g.m)edges.push({t:'cpl',x1:gx+CW,x2:gm,y:rowY(-2)+CH/2});
      const ox=(g.f&&g.m)?(gx+CW+gm)/2:(g.f?gx+CW/2:gm+CW/2),oy=(g.f&&g.m)?rowY(-2)+CH/2:rowY(-2)+CH;
      edges.push({t:'pc',x1:ox,y1:oy,x2:g.kid+CW/2,y2:rowY(-1)})});
  }
  const minX=Math.min(...out.map(o=>o.x)),maxX=Math.max(...out.map(o=>o.x))+CW;
  const minY=Math.min(...out.map(o=>o.y)),maxY=Math.max(...out.map(o=>o.y))+CH;
  const dx=PAD-minX,dy=PAD-minY,W=maxX-minX+PAD*2,H=maxY-minY+PAD*2;
  let svg=`<svg width="${W}" height="${H}">`;
  edges.forEach(e=>{if(e.t==='cpl')svg+=`<path class="edge cpl" d="M${e.x1+dx} ${e.y+dy} H${e.x2+dx}"/>`;
    else{const ym=e.y2-RG/2;svg+=`<path class="edge" d="M${e.x1+dx} ${e.y1+dy} V${ym+dy} H${e.x2+dx} V${e.y2+dy}"/>`}});
  svg+='</svg>';
  let html='';
  out.forEach(o=>{html+=o.ph?phHTML(o.ph,o.x+dx,o.y+dy,CW,CH):cardHTML(byId[o.id],o.x+dx,o.y+dy,CW,CH,o.o)});
  stFam.set(svg+html,W,H);
  const fp=pos[focusId];
  stFam.center(fp.x+dx+CW/2,fp.y+dy+CH/2,mobile()?.78:1);
}

  <ul>
    <li><b>Мамина мамина линия (Кузьменко, Пидько):</b> зажиточные крестьяне, свой двор. Прапрадеда Захара Пидько и прапрабабушку Феодосию (в девичестве Питько) раскулачили, и они приехали в Приморье с Урала. Захар погиб на войне — мама нашла архивную запись.</li>
    <li><b>Мамина папина линия (Стахеевы):</b> бизнесмены — меценатство, торговля, золото; «знатный род, ещё при Пушкине»; по рассказам, есть татарская кровь. Известные Стахеевы — купцы из Елабуги (Татарстан): Николай Дмитриевич Стахеев был золотопромышленником и меценатом, в его доме у Лубянки жил Маяковский (упомянул это в поэме «Хорошо!»). А Зея, откуда прадед Евгений, — золотоносный край. Это совпадения, а не доказательства родства.</li>
  </ul>
  <h2>Откуда сведения</h2>
  <ul>
    <li>Распечатка семейного древа, которую составляла мама (Екатерина Анатольевна), с рукописными дополнениями.</li>
    <li>Рассказы Всеволода и мамы (ноябрь 2026).</li>
    <li>Поиск в открытых источниках: «Дорога памяти», «Бессмертный полк», «Открытый список», форум ВГД, реестры предпринимателей.</li>
  </ul>
  <h2>Что уже нашли</h2>
  <ul>
    <li><b>Дед Геннадий Леонтьевич Дулов</b> есть в реестре предпринимателей: ИП и три фирмы в Приморье, одна — в Трудовом. Запись закрыта «в связи со смертью» в апреле 2012 г.</li>
    <li><b>Пгт Кировский</b> до 1939 г. назывался с. Успенка — по этому названию искать документы 1930-х.</li>
    <li><b>Пидько Захар Павлович</b> (1909) убит 7 августа 1944 г. — архивную запись нашла мама. На Урале в 1930 г. раскулачены Пидько с тем же отчеством (Ефим и Федор Павловичи) — возможно, его братья.</li>
    <li><b>Стахеевы:</b> в 1931 г. семью Стахеевых из Татарстана выслали в Зейский район — возможно, тот же род, что прадед Евгений Васильевич из Зеи.</li>
  </ul>
  <h2>Что можно запросить в ЗАГС и архивах</h2>
  <p class="muted">Самые точные ответы дают актовые записи. Запрашивает прямой потомок с документами о родстве — через Госуслуги или отдел ЗАГС.</p>
  <ol>
    <li>Рождение <b>Геннадия Леонтьевича Дулова</b> (19.01.1948, Трудовое → ЗАГС г. Артёма): полное ФИО Леонтия и мать деда.</li>
    <li>Брак <b>Геннадия Дулова и Тамары Коротченко</b> (около 1968): место рождения бабушки и полные ФИО.</li>
    <li>Рождение <b>Бориса Васильевича Кузьменко</b> (03.01.1932, с. Успенка): ФИО его родителей.</li>
    <li>Рождение <b>Клавдии Захаровны Пидько</b> (04.02.1936, Кировский): возраст родителей и их место рождения.</li>
    <li>Рождение <b>Анатолия Евгеньевича Стахеева</b> (07.12.1948, Владивосток): полные ФИО родителей.</li>
    <li>Архивы: похозяйственные книги Трудового и Успенки (Госархив Приморья), личное дело моряка в архиве пароходства, учётная карточка Е. В. Стахеева в военкомате Зеи.</li>
  </ol>
  <p class="muted" style="margin-top:24px">Составлено в ноябре 2026. Даты — со слов семьи, если не сказано иначе. Кнопка с глазом вверху убирает день и месяц рождения у живущих — удобно, если показываешь древо кому-то не из семьи.</p>`;
}

/* ===================== КАРТОЧКА ЧЕЛОВЕКА ===================== */
function chip(id){const p=byId[id];return `<span class="chip" data-id="${id}" style="--c:${color(p)}"><span class="d"></span>${esc([p.fn,realSn(p)].filter(Boolean).join(' '))}</span>`}
function openPanel(id){
  const p=byId[id];if(!p)return;
  const sp=spouses(id),ch=children(id).sort(byBirth),sb=siblings(id).sort(byBirth),par=[p.f,p.m].filter(Boolean);
  const st=p.st==='hyp'?'<span class="st hyp">Гипотеза</span>':(p.st==='doc'?'<span class="st doc">◆ Есть запись в реестре</span>':'<span class="st">Со слов семьи</span>');
  let kv='';const add=(k,v)=>{if(v)kv+=`<dt>${k}</dt><dd>${esc(v)}</dd>`};
  add('Родился(ась)',fullDate(p.b,p));add('Умер(ла)',p.d?p.d:(p.dead?'дата неизвестна':''));add('Место',p.pl);add('Занятие',p.oc);
  const sec=(t,ids)=>ids.length?`<div class="sec">${t}</div><div class="chips">${ids.map(chip).join('')}</div>`:'';
  const half=sb.some(q=>{const o=byId[q];return !(o.f===p.f&&o.m===p.m)});
  const inTree=!!treePos[id];
  const panel=$('#panel');panel.style.setProperty('--c',color(p));
  const ph=PH[id]?`<img class="pph" src="${PH[id]}" alt="Фото: ${esc(fullName(p))}" data-act="photo">`:'';
  panel.innerHTML=`<div class="hd${ph?' hasph':''}"><div class="grip" style="grid-column:1/-1"></div><button class="x" data-act="close" aria-label="Закрыть">×</button>${ph}<div>
    <div class="rel">${esc(p.rel)}</div><h3>${esc(fullName(p)||p.fn)}</h3>${p.ms&&p.ms!=='?'?`<div class="mn">прежняя (девичья) фамилия: ${esc(p.ms)}</div>`:''}${st}</div></div>
    <div class="bd">${kv?`<dl class="kv">${kv}</dl>`:''}
    ${p.notes&&p.notes.length?`<div class="sec">Что известно</div><ul class="notes">${p.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
    ${sec('Родители',par)}${sec('Муж / жена',sp)}${sec('Дети',ch)}${sec('Братья и сёстры',sb)}
    ${half?'<p class="muted" style="font-size:12.5px;margin:7px 0 0;color:var(--muted)">Некоторые — братья и сёстры только по одному из родителей.</p>':''}
    ${p.src&&p.src.length?`<div class="sec">Источники</div><ul class="notes src">${p.src.map(s=>`<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('')}</ul>`:''}
    <div class="acts"><button class="btn" data-act="fam" data-pid="${id}">Показать семью</button>${inTree&&view!=='tree'?`<button class="btn ghost" data-act="tree" data-pid="${id}">Найти на дереве</button>`:''}</div></div>`;
  panel.classList.add('on');$('#scrim').classList.add('on');
}
function closePanel(){$('#panel').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();$('#sbar').classList.remove('on')}});
$('#panel').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){const id=a.dataset.pid;
    if(a.dataset.act==='photo'){a.classList.toggle('big');return}
    if(a.dataset.act==='close')closePanel();
    if(a.dataset.act==='fam'){if(id!==focusId)navHist.push(focusId);focusId=id;closePanel();setView('fam')}
    if(a.dataset.act==='tree'){closePanel();setView('tree');const t=treePos[id];stTree.center(t.x,t.y,Math.max(stTree.s,mobile()?.7:.9))}
    return}
  const c=e.target.closest('.chip[data-id]');
  if(c){const id=c.dataset.id;if(view==='fam'){focusId=id;renderFam()}openPanel(id)}
});
$('#list').addEventListener('click',e=>{const r=e.target.closest('.row[data-id]');if(!r)return;if(mobile()){navHist.push(focusId);focusId=r.dataset.id;setView('fam')}else openPanel(r.dataset.id)});
const tapPerson=id=>{if(mobile()){if(id!==focusId){navHist.push(focusId)}focusId=id;setView('fam')}else openPanel(id)};
stTree.onTap=tapPerson;
stAll.onTap=tapPerson;
stFam.onTap=id=>{if(id!==focusId){focusId=id;renderFam()}openPanel(id)};

/* ===================== ВКЛАДКИ, ПОИСК, КНОПКИ ===================== */
let view='tree';
function setView(v){
  view=v;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const sec=mobile()&&v==='fam'?'nav':(mobile()&&v==='all'?'out':v);
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+sec));
  $('#zoom').style.display=(sec==='tree'||sec==='fam'||sec==='all')?'flex':'none';
  if(v==='tree'){if(!treeDrawn){treeDrawn=true;initTreeView()}else stTree.apply()}
  if(v==='fam'){if(mobile()){closePanel();renderNav()}else renderFam()}
  if(v==='all'){if(mobile()){closePanel();if(!outDrawn){outDrawn=true;renderOut()}}else if(!allDrawn){allDrawn=true;renderAll();initAllView()}else stAll.apply()}
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});
const curStage=()=>view==='fam'?stFam:(view==='all'?stAll:stTree);
$('#zin').onclick=()=>curStage().zoomBy(1.25);
$('#zout').onclick=()=>curStage().zoomBy(1/1.25);
$('#zfit').onclick=()=>curStage().fit();
$('#bDates').onclick=()=>{hideDates=!hideDates;$('#bDates').classList.toggle('on',hideDates);closePanel();toast(hideDates?'Даты рождения живущих скрыты':'Даты снова видны')};
$('#bSearch').onclick=()=>{const b=$('#sbar');b.classList.toggle('on');$('#bSearch').classList.toggle('on',b.classList.contains('on'));if(b.classList.contains('on'))setTimeout(()=>$('#q').focus(),30)};
const q=$('#q'),sg=$('#sugg');
q.addEventListener('input',()=>{const f=q.value.trim().toLowerCase();
  const hits=f?P.filter(p=>(fullName(p)+' '+(p.ms||'')+' '+p.rel).toLowerCase().includes(f)).slice(0,8):[];
  sg.innerHTML=hits.map(p=>`<div data-pick="${p.id}">${esc(fullName(p)||p.fn)} <small>· ${esc(p.rel)}</small></div>`).join('')||(f?'<div><small>Никого не нашлось</small></div>':'')});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const d=sg.querySelector('[data-pick]');if(d)pick(d.dataset.pick)}});
sg.addEventListener('click',e=>{const d=e.target.closest('[data-pick]');if(d)pick(d.dataset.pick)});
function pick(id){$('#sbar').classList.remove('on');$('#bSearch').classList.remove('on');q.value='';sg.innerHTML='';q.blur();
  if(mobile()){if(id!==focusId)navHist.push(focusId);focusId=id;setView('fam');return}
  if(view==='fam'){focusId=id;renderFam()}
  else if(view==='tree'&&treePos[id]){const t=treePos[id];stTree.center(t.x,t.y,Math.max(stTree.s,mobile()?.7:.9))}
  else if(view==='all'&&allPos[id]){const t=allPos[id];stAll.center(t.x,t.y,Math.max(stAll.s,mobile()?.6:.8))}
  openPanel(id)}
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('off');clearTimeout(tt);tt=setTimeout(()=>el.classList.add('off'),2600)}
addEventListener('resize',()=>{stTree.apply();stFam.apply();stAll.apply()});

/* ===================== СТАРТ ===================== */
renderTree();renderList();renderAbout();
{const h=new URLSearchParams(location.hash.slice(1));if(h.get('p')&&byId[h.get('p')])focusId=h.get('p');
 setView(h.get('v')||(mobile()?'fam':'tree'));if(h.get('open')&&byId[h.get('open')])openPanel(h.get('open'))}
setTimeout(()=>$('#toast').classList.add('off'),5500);
</script>
</body>
</html>
